# ModelPort 单机部署配置
#
# 基于上游 New API（QuantumNous/new-api）改造；上游发布镜像为
# calciumion/new-api。当前个人版默认从本仓库源码构建，不直接运行上游镜像。
#
# 默认使用当前仓库构建镜像，并使用 /data 中的 SQLite 数据库。
#
# 启动：
#   docker compose up -d --build
# 访问：http://localhost:3000
#
# 如需使用 PostgreSQL、MySQL 或 Redis，请通过 SQL_DSN、REDIS_CONN_STRING
# 等环境变量接入外部服务；个人版默认不启动这些依赖。

services:
  modelport:
    build:
      context: .
      dockerfile: Dockerfile
    image: modelport:local
    container_name: modelport
    restart: unless-stopped
    command: --log-dir /app/logs
    ports:
      - '3000:3000'
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQLITE_PATH=/data/modelport.db?_pragma=busy_timeout(30000)&_pragma=journal_mode(WAL)&_txlock=immediate
      - TZ=${TZ:-Asia/Shanghai}
      - ERROR_LOG_ENABLED=${ERROR_LOG_ENABLED:-true}
      - BATCH_UPDATE_ENABLED=${BATCH_UPDATE_ENABLED:-true}
      - NODE_NAME=${NODE_NAME:-modelport}
      # These secrets must stay stable across restarts. Compose fails early when
      # either value is missing instead of letting the application generate a
      # new random value for every container start.
      - SESSION_SECRET=${SESSION_SECRET:?请先设置持久的 SESSION_SECRET}
      - CRYPTO_SECRET=${CRYPTO_SECRET:?请先设置持久的 CRYPTO_SECRET}
      - SQL_DSN=${SQL_DSN:-}
      - LOG_SQL_DSN=${LOG_SQL_DSN:-}
      - REDIS_CONN_STRING=${REDIS_CONN_STRING:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -q '\"success\":true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
